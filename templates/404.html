{% extends "base.html" %}

{% block title %}Page Not Found — CelebrAI{% endblock %}

{% block content %}
<div class="container" style="padding-top: 80px; text-align: center; max-width: 600px;">
  <div class="card" style="padding: 60px 30px;">
    <div style="width: 80px; height: 80px; background: var(--purple-100); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--purple-900); margin: 0 auto 24px;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>
    <h1 style="font-size: 2.2rem; color: var(--purple-900); margin-bottom: 12px;">404 &bull; Page Not Found</h1>
    <p style="color: var(--text-secondary); font-size: 1rem; margin-bottom: 28px;">
      {{ message or "The celebration plan or page you are looking for does not exist or may have been removed." }}
    </p>
    <div style="display: flex; gap: 12px; justify-content: center;">
      <a href="{{ url_for('index') }}" class="btn btn-secondary">
        Return to Home
      </a>
      <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
        Go to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
