name: CI & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Static Type Check & Lint
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Run Python Core Verification Tests
        run: python3 -m unittest test_app.py

      - name: Build Production Bundle
        run: npm run build
